<title>Debate Arena</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a stadium-style header over a single centered column; For bubbles hug the left rail, Against the right. */
  :root {
    --bg: #f3f1f8;
    --surface: #ffffff;
    --fg: #1e1b2e;
    --muted: #625d7a;
    --line: #d9d4e8;
    --for: #1f5fd1;
    --for-soft: #e3ecff;
    --against: #d6411f;
    --against-soft: #ffe8e1;
    --on-accent: #ffffff;
    --danger: #b3261e;
    --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
    --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14111f; --surface: #1f1b30; --fg: #f0edfa; --muted: #a9a3c2; --line: #38324f;
      --for: #6f9cff; --for-soft: #1b2850; --against: #ff7a57; --against-soft: #4a2217;
      --on-accent: #10101a; --danger: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14111f; --surface: #1f1b30; --fg: #f0edfa; --muted: #a9a3c2; --line: #38324f;
    --for: #6f9cff; --for-soft: #1b2850; --against: #ff7a57; --against-soft: #4a2217;
    --on-accent: #10101a; --danger: #ff8a80; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
    margin: 0;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  header { display: flex; flex-direction: column; gap: 4px; }
  .versus { margin: 0; font-weight: 400; display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: clamp(1.9rem, 8vw, 3rem); line-height: 1; letter-spacing: .01em; }
  .versus .f { color: var(--for); } .versus .a { color: var(--against); }
  .versus .vs { font-size: .45em; color: var(--muted); border: 2px solid var(--line); border-radius: 999px; padding: .25em .6em; }
  .tagline { margin: 0; color: var(--muted); }
  .banner { margin: 0; padding: 12px 14px; border: 2px solid var(--danger); border-radius: 8px; color: var(--danger); background: var(--surface); font-weight: 500; }
  label, .label { font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  input, textarea { font: inherit; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
  textarea { resize: vertical; min-height: 84px; }
  input:disabled, textarea:disabled { opacity: .6; }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  #setup { display: flex; flex-direction: column; gap: 16px; }
  .topic-row { display: flex; gap: 8px; }
  .topic-row input { flex: 1; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .sides { grid-template-columns: 1fr; } }
  .side-for textarea { border-color: var(--for); } .side-against textarea { border-color: var(--against); }
  .side-for label { color: var(--for); } .side-against label { color: var(--against); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 2px solid var(--fg); background: var(--surface); color: var(--fg); padding: 10px 16px; font-weight: 700; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #dice { font-size: 1.3rem; padding: 6px 12px; line-height: 1; }
  #start { background: var(--fg); color: var(--bg); font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; padding: 14px 20px; }
  #arena { display: flex; flex-direction: column; gap: 16px; }
  .topic-banner { margin: 0; padding: 12px 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #status { margin: 0; flex: 1; min-width: 0; color: var(--muted); font-family: var(--font-mono); font-size: .85rem; }
  #stop { border-color: var(--danger); color: var(--danger); }
  #transcript { display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 88%; display: flex; flex-direction: column; gap: 6px; min-width: 0; padding: 12px 14px; border-radius: 14px; border: 2px solid; background: var(--surface); }
  .bubble[data-side="for"] { align-self: flex-start; border-color: var(--for); border-bottom-left-radius: 2px; background: var(--for-soft); }
  .bubble[data-side="against"] { align-self: flex-end; border-color: var(--against); border-bottom-right-radius: 2px; background: var(--against-soft); }
  .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .emoji { font-size: 1.6rem; line-height: 1; }
  .name { font-weight: 700; overflow-wrap: anywhere; }
  .round { font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--on-accent); padding: 2px 8px; border-radius: 999px; }
  .bubble[data-side="for"] .round { background: var(--for); } .bubble[data-side="against"] .round { background: var(--against); }
  .text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  details { font-size: .85rem; color: var(--muted); }
  summary { cursor: pointer; font-family: var(--font-mono); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  .hood-msg { margin: 8px 0 0; }
  .hood-role { font-family: var(--font-mono); font-weight: 500; color: var(--fg); }
  .hood-msg pre { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--font-mono); font-size: .78rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 18rem; overflow: auto; }
  @media (max-width: 560px) { .bubble { max-width: 96%; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
</style>

<main>
  <header>
    <h1 class="versus" aria-label="Debate Arena"><span class="f">DEBATE</span><span class="vs">VS</span><span class="a">ARENA</span></h1>
    <p class="tagline">Pick a topic, cast two debaters, and watch three rounds unfold.</p>
  </header>

  <p id="banner" class="banner" role="alert" hidden></p>

  <form id="setup" autocomplete="off">
    <div class="field">
      <label for="topic">Topic</label>
      <div class="topic-row">
        <input id="topic" type="text" maxlength="200" placeholder="Is a hot dog a sandwich?">
        <button id="dice" type="button" title="Random topic" aria-label="Random topic">🎲</button>
      </div>
    </div>
    <div class="sides">
      <div class="field side-for">
        <label for="forPersona">For (optional persona)</label>
        <textarea id="forPersona" maxlength="300" placeholder="Leave blank to invent one"></textarea>
      </div>
      <div class="field side-against">
        <label for="againstPersona">Against (optional persona)</label>
        <textarea id="againstPersona" maxlength="300" placeholder="Leave blank to invent one"></textarea>
      </div>
    </div>
    <button id="start" type="submit" disabled>Connecting…</button>
  </form>

  <section id="arena" hidden>
    <p class="topic-banner" id="topicBanner"></p>
    <div class="toolbar">
      <p id="status" role="status"></p>
      <button id="stop" type="button" hidden>Stop</button>
      <button id="newDebate" type="button" hidden>New debate</button>
    </div>
    <div id="transcript"></div>
  </section>
</main>

<script src="logic.js"></script>
<script src="app.js"></script>
